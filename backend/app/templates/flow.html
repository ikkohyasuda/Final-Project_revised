<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おくすりのチェック</title>
    <style>
      :root {
        --bg: #eef5f4;
        --card: #ffffff;
        --text: #1b2a2f;
        --muted: #4a6a73;
        --accent: #2a7f7b;
        --accent-dark: #1f5e5b;
        --line: #d7e4e2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
        line-height: 1.8;
        font-size: 20px;
        color: var(--text);
        background:
          radial-gradient(1100px 520px at 80% -10%, #d6f0ea 0%, transparent 60%),
          radial-gradient(900px 380px at 10% 10%, #d7ecff 0%, transparent 55%),
          var(--bg);
      }
      h1 { font-size: 32px; margin: 0 0 8px; }
      h2 { font-size: 24px; margin: 0; }
      button, input { font-size: 20px; }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      .header {
        margin-bottom: 24px;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        color: var(--accent-dark);
        font-weight: 600;
        text-decoration: none;
      }
      .back-link:hover { text-decoration: underline; }
      .header p {
        color: var(--muted);
        margin: 8px 0 0;
      }
      .section { margin-bottom: 24px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 10px 28px rgba(16, 40, 45, 0.08);
      }
      .step {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .step-number {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #dff2ee;
        color: var(--accent-dark);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .hint {
        color: var(--muted);
        margin: 0 0 12px;
      }
      .status {
        padding: 12px 14px;
        background: #f4faf9;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-top: 12px;
      }
      .hidden { display: none; }
      .primary {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        box-shadow: 0 6px 16px rgba(42, 127, 123, 0.24);
        cursor: pointer;
      }
      .primary:hover { background: var(--accent-dark); }
      .primary:disabled {
        background: #b9d4d1;
        box-shadow: none;
        cursor: not-allowed;
      }
      .file-input {
        display: block;
        padding: 10px 0;
      }
      #symptom-forms form {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        margin-bottom: 16px;
        background: #fbfdfc;
      }
      .form-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .secondary {
        background: #eef5f4;
        color: var(--accent-dark);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 16px;
        cursor: pointer;
      }
      .secondary:hover { background: #e3f0ee; }
      #pdf-link a {
        display: inline-block;
        margin-top: 12px;
        color: var(--accent-dark);
        font-weight: 600;
      }
      .report-item {
        margin-bottom: 16px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fbfdfc;
      }
      .footer-actions {
        margin-top: 24px;
        text-align: right;
      }
      @media (max-width: 640px) {
        body { font-size: 18px; }
        h1 { font-size: 28px; }
        h2 { font-size: 22px; }
        .card { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <a class="back-link" href="/">&larr; 戻る</a>
        <h1>おくすりのチェック</h1>
        <p>画像をアップロードすると、自動で読み取りと照合が進みます。</p>
      </div>

      <div class="section card">
        <div class="step">
          <div class="step-number">1</div>
          <h2>画像アップロード</h2>
        </div>
        <p class="hint">お薬手帳の写真を選んでください。</p>
        <form id="upload-form" novalidate>
          <input id="upload-file" class="file-input" type="file" name="file" accept=".jpg,.jpeg,.png,.heic,.heif" />
          <button type="button" id="upload-button" class="primary">画像をアップロード</button>
        </form>
        <div id="upload-status" class="status hidden"></div>
      </div>

      <div class="section card">
        <div class="step">
          <div class="step-number">2</div>
          <h2>症状チェック</h2>
        </div>
        <p class="hint">気になる症状にチェックを入れて「結果を見る」を押してください。</p>
        <div id="symptom-forms"></div>
        <button id="symptom-submit" class="primary" type="button" disabled>結果を見る</button>
      </div>

      <div class="section card">
        <div class="step">
          <div class="step-number">3</div>
          <h2>結果</h2>
        </div>
        <div id="report-preview"></div>
        <button id="pdf-button" class="primary" disabled>プリントする</button>
        <div id="pdf-link"></div>
        <div class="footer-actions">
          <a class="secondary" href="/">終了する</a>
        </div>
      </div>
    </div>

    <script>
      const uploadForm = document.getElementById('upload-form');
      const uploadFile = document.getElementById('upload-file');
      const uploadButton = document.getElementById('upload-button');
      const uploadStatus = document.getElementById('upload-status');
      const symptomForms = document.getElementById('symptom-forms');
      const symptomSubmit = document.getElementById('symptom-submit');
      const reportPreview = document.getElementById('report-preview');
      const pdfButton = document.getElementById('pdf-button');
      const pdfLink = document.getElementById('pdf-link');

      let imageId = null;
      let taskId = null;
      let reportId = null;

      const showStatus = (el, message) => {
        el.textContent = message;
        el.classList.remove('hidden');
      };

      uploadFile.addEventListener('change', () => {
        if (uploadFile.files.length > 0) {
          showStatus(uploadStatus, `選択中: ${uploadFile.files[0].name}`);
        }
      });

      uploadButton.addEventListener('click', async () => {
        if (uploadFile.files.length === 0) {
          showStatus(uploadStatus, '画像が選択されていません。');
          return;
        }
        showStatus(uploadStatus, 'アップロード中...');
        const formData = new FormData(uploadForm);
        const response = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await response.json();
        if (!response.ok) {
          showStatus(uploadStatus, data.detail || 'アップロードに失敗しました。');
          return;
        }
        imageId = data.image_id;
        showStatus(uploadStatus, 'アップロード完了。読み取り中...');
        await runOcr();
      });

      const runOcr = async () => {
        if (!imageId) return;
        const formData = new FormData();
        formData.append('image_id', imageId);
        const response = await fetch('/api/ocr', { method: 'POST', body: formData });
        const data = await response.json();
        if (!response.ok) {
          showStatus(uploadStatus, data.detail || 'OCRに失敗しました。');
          return;
        }
        taskId = data.task_id;
        const statusResponse = await fetch(`/api/ocr/status/${taskId}`);
        const statusData = await statusResponse.json();
        if (!statusResponse.ok || statusData.status !== 'completed') {
          showStatus(uploadStatus, statusData.error || 'OCRが完了しませんでした。');
          return;
        }
        showStatus(uploadStatus, '読み取り完了。照合中...');
        await runCheck();
      };

      const runCheck = async () => {
        if (!imageId) return;
        const formData = new FormData();
        formData.append('image_id', imageId);
        const response = await fetch('/api/drugs/check', { method: 'POST', body: formData });
        const data = await response.json();
        if (!response.ok) {
          showStatus(uploadStatus, data.detail || '照合に失敗しました。');
          return;
        }
        showStatus(uploadStatus, '照合完了。症状を選んでください。');
        await renderSymptoms();
      };

      const renderSymptoms = async () => {
        symptomForms.innerHTML = '';
        symptomSubmit.disabled = true;
        const formData = new FormData();
        formData.append('image_id', imageId);
        const response = await fetch('/api/drugs/symptoms', { method: 'POST', body: formData });
        const data = await response.json();
        if (!response.ok) {
          const error = document.createElement('p');
          error.textContent = data.detail || '症状取得に失敗しました。';
          symptomForms.appendChild(error);
          return;
        }
        if (!data.items || data.items.length === 0) {
          symptomSubmit.disabled = true;
          return;
        }
        data.items.forEach((item) => {
          const form = document.createElement('form');
          form.action = '/api/drugs/symptoms/check';
          form.method = 'post';
          const header = document.createElement('div');
          header.className = 'form-header';
          header.innerHTML = `<h3>薬剤: ${item.medicine_name}</h3>`;
          const optOut = document.createElement('button');
          optOut.type = 'button';
          optOut.className = 'secondary';
          optOut.textContent = 'この薬は使用していません';
          optOut.addEventListener('click', () => {
            form.remove();
          });
          header.appendChild(optOut);
          form.appendChild(header);

          const matchInput = document.createElement('input');
          matchInput.type = 'hidden';
          matchInput.name = 'match_id';
          matchInput.value = item.match_id;
          form.appendChild(matchInput);

          item.side_effects.forEach((effect) => {
            const label = document.createElement('label');
            label.style.display = 'block';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.name = 'symptom';
            checkbox.value = effect.side_effect_id;
            label.appendChild(checkbox);
            label.append(` ${effect.symptom_name}`);
            form.appendChild(label);
          });

          const hiddenList = document.createElement('input');
          hiddenList.type = 'hidden';
          hiddenList.name = 'side_effect_ids';
          form.appendChild(hiddenList);

          symptomForms.appendChild(form);
        });
        symptomSubmit.disabled = false;
      };

      symptomSubmit.addEventListener('click', async () => {
        const forms = Array.from(symptomForms.querySelectorAll('form'));
        if (forms.length === 0) return;
        for (const form of forms) {
          const selected = Array.from(form.querySelectorAll('input[name="symptom"]:checked'))
            .map((checkbox) => checkbox.value)
            .join(',');
          if (!selected) {
            alert('症状を1つ以上選択してください。');
            return;
          }
          const hiddenList = form.querySelector('input[name="side_effect_ids"]');
          hiddenList.value = selected;
          const formData = new FormData(form);
          const response = await fetch('/api/drugs/symptoms/check', { method: 'POST', body: formData });
          const data = await response.json();
          if (!response.ok) {
            alert(data.detail || '保存に失敗しました。');
            return;
          }
        }
        await generateReport();
      });

      const generateReport = async () => {
        if (!imageId) return;
        reportPreview.innerHTML = '';
        pdfLink.innerHTML = '';
        const formData = new FormData();
        formData.append('image_id', imageId);
        const response = await fetch('/api/report/generate', { method: 'POST', body: formData });
        const data = await response.json();
        if (!response.ok) {
          reportPreview.textContent = data.detail || '生成に失敗しました。';
          return;
        }
        reportId = data.report_id;
        reportPreview.appendChild(buildReportPreview(data));
        pdfButton.disabled = false;
      };

      pdfButton.addEventListener('click', () => {
        if (!reportId) return;
        pdfLink.innerHTML = `<a href="/api/report/${reportId}/pdf" target="_blank">プリントした内容を確認する</a>`;
      });

      const buildReportPreview = (data) => {
        const container = document.createElement('div');
        if (!data.matched || data.matched.length === 0) {
          const empty = document.createElement('p');
          empty.textContent = '該当薬剤がありません。';
          container.appendChild(empty);
          return container;
        }

        data.matched.forEach((item) => {
          const block = document.createElement('div');
          block.className = 'report-item';

          const med = document.createElement('p');
          med.textContent = `内服薬: ${item.medicine_name}`;
          block.appendChild(med);

          if (!item.checked_symptoms || item.checked_symptoms.length === 0) {
            const none = document.createElement('p');
            none.textContent = '自覚する症状: なし';
            block.appendChild(none);
            container.appendChild(block);
            return;
          }

          const names = item.checked_symptoms.map((symptom) => symptom.symptom_name).join('、');
          const symptomLine = document.createElement('p');
          symptomLine.textContent = `自覚する症状: ${names}`;
          block.appendChild(symptomLine);

          const note = document.createElement('p');
          note.textContent = `${item.medicine_name}で「${names}」が起きることがあります。気になるときは医師・薬剤師に相談しましょう。`;
          block.appendChild(note);

          container.appendChild(block);
        });

        return container;
      };
    </script>
  </body>
</html>
